
<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Interview Vault</title><link rel="stylesheet" href="styles.css"/></head><body><main><p class="eyebrow">YOUR KNOWLEDGE BASE</p><h1>Interview Vault</h1><p>Build your career advantage, one question at a time.</p><button id="openModal">+ Add question</button><input id="search" placeholder="Search questions, tags, or answers..."/><select id="difficulty"><option value="">All levels</option><option>Easy</option><option>Medium</option><option>Hard</option></select><select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option></select><button id="clearFilters">Clear filters</button><h2 id="sectionTitle">All questions</h2><span id="questionCount"></span><section id="questionGrid"></section><div id="emptyState" hidden>No questions found</div></main><dialog id="questionModal"><form method="dialog" id="questionForm"><h2>Add a question</h2><input name="title" required placeholder="Question"/><textarea name="answer" required placeholder="Answer"></textarea><select name="category"><option>JavaScript</option><option>React</option><option>Backend</option><option>Databases</option><option>General</option></select><select name="difficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option></select><input name="tags" placeholder="tags, comma separated"/><button type="submit">Save question</button></form></dialog><template id="questionTemplate"><article><small class="collection"></small><button class="star">☆</button><h3></h3><p class="answer"></p><div class="tags"></div><small class="difficulty"></small></article></template><script src="app.js"></script></body></html>
